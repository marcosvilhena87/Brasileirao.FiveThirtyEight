name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Tests
        run: python -m pytest -q
      - name: Score calibration report (2025 holdout)
        run: python -m brasileirao538.goal_calibration
      - name: Relative goal intensity temporal evaluation
        run: python -m brasileirao538.relative_goals
